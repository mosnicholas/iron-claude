name: e2e CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    name: e2e smoke
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ic_e2e
          POSTGRES_PASSWORD: ic_e2e
          POSTGRES_DB: ic_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ic_e2e"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      E2E_PG_URL: postgres://ic_e2e:ic_e2e@localhost:5432/ic_e2e
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Run smoke e2e
        run: npm run test:e2e:smoke

  full:
    name: e2e full (PR)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ic_e2e
          POSTGRES_PASSWORD: ic_e2e
          POSTGRES_DB: ic_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ic_e2e"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      E2E_PG_URL: postgres://ic_e2e:ic_e2e@localhost:5432/ic_e2e
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Run full e2e
        run: npm run test:e2e:full
