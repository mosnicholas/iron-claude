services:
  postgres:
    image: postgres:18-alpine
    container_name: ironclaude-postgres
    environment:
      POSTGRES_USER: ironclaude
      POSTGRES_PASSWORD: ironclaude
      POSTGRES_DB: ironclaude
    ports:
      - "5432:5432"
    volumes:
      - ironclaude-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ironclaude"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  ironclaude-pgdata:
